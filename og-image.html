<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a4d7a 0%, #0a1628 100%);
    font-family: 'Comfortaa', Arial, sans-serif;
    overflow: hidden;
  }
  .container {
    text-align: center;
    color: white;
    position: relative;
    z-index: 2;
  }
  .triangle {
    font-size: 120px;
    margin-bottom: 30px;
  }
  h1 {
    font-size: 72px;
    font-weight: 700;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #5eead4, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 32px;
    color: #5eead4;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .description {
    font-size: 24px;
    color: #94a3b8;
    max-width: 1000px;
  }
  .footer-emoji {
    position: absolute;
    bottom: 40px;
    left: 50px;
    font-size: 48px;
  }
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <div class="triangle">🔺</div>
  <h1>Бермудський трикутник</h1>
  <div class="subtitle">Найзагадковіше місце на Землі</div>
  <div class="description">Дізнайтеся про історію, теорії та реальні факти</div>
</div>
<div class="footer-emoji">🌊 ⛵ ✈️</div>

<script>
  // Use html2canvas or similar to generate PNG
  // For now, this is just the template
  console.log('To convert this to PNG, use: html2canvas or similar tool');
</script>
</body>
</html>
