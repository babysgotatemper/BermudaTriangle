<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative stars -->
  <circle cx="100" cy="80" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1050" cy="150" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="450" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="1100" cy="500" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="300" cy="250" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Main Triangle -->
  <g transform="translate(250, 150)">
    <polygon points="100,20 180,200 20,200" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="5 3"/>
    <circle cx="100" cy="120" r="8" fill="#f97316"/>
  </g>

  <!-- Main Text -->
  <text x="600" y="200" font-family="'Comfortaa', sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#ffffff">
    Бермудський
  </text>
  <text x="600" y="280" font-family="'Comfortaa', sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#ffffff">
    трикутник
  </text>

  <!-- Gradient text subtitle -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5eead4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="600" y="380" font-family="'Inter', sans-serif" font-size="40" text-anchor="middle" fill="url(#textGradient)" font-weight="600">
    Найзагадковіше місце на Землі
  </text>

  <!-- Bottom text -->
  <text x="600" y="520" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle" fill="#94a3b8">
    Дізнайтеся про історію, теорії та факти
  </text>

  <!-- Logo/emoji -->
  <text x="1100" y="550" font-size="48">🔺</text>
  <text x="80" y="580" font-size="40">🌊 ⛵ ✈️</text>
</svg>
